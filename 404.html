<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada | Balance</title>
    <link rel="stylesheet" href="css/404.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="error-container">
      <div class="error-content">
        <div class="error-icon">💸</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-message">Esta página no existe.</p>
        <div class="error-actions">
          <a href="index.html" class="btn btn-primary">Volver al inicio</a>
          <a
            href="#"
            onclick="
              history.back();
              return false;
            "
            class="btn btn-secondary"
            >Regresar</a
          >
        </div>
      </div>

      <div class="error-decoration">
        <div class="floating-coin coin-1">💰</div>
        <div class="floating-coin coin-2">💵</div>
        <div class="floating-coin coin-3">💳</div>
        <div class="floating-coin coin-4">🪙</div>
      </div>
    </div>
  </body>
</html>
